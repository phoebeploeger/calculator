<!DOCTYPE html>
<html>
<head>
<title>Learnig JavaScript</title>
</head>
<body>

<h1>Learning JavaScript with some HTML documents.</h1>

<p> First number? <input id= "fn"> <br>
Second number? <input id="sn"> <br>
<button onclick="add()"> + </button>
<button onclick="subtract()"> - </button>
<button onclick="multiplication()"> * </button>
<button onclick="division()"> / </button>

</p>
<p>
  Your Answer <span id="ans"> _______ </span></p>
<script>
function add() {
let a = document.getElementById("fn").value;
let b = document.getElementById("sn").value;
let c = Number(a) + Number(b);
document.getElementById("ans").innerHTML = c;
}

function subtract() {
let a = document.getElementById("fn").value;
let b = document.getElementById("sn").value;
let c = Number(a) - Number(b);
document.getElementById("ans").innerHTML = c;
}

function multiplication() {
let a = document.getElementById("fn").value;
let b = document.getElementById("sn").value;
let c = Number(a) * Number(b);
document.getElementById("ans").innerHTML = c;
}

function division() {
let a = document.getElementById("fn").value;
let b = document.getElementById("sn").value;
let c = Number(a) / Number(b);
document.getElementById("ans").innerHTML = c;
}


</script> 

</body>
</html>
